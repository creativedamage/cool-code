# Builds COOL Code and publishes a GitHub Release when a version tag is pushed.
#
#   1. Bump "version" in package.json (e.g. 1.3.1)
#   2. Commit, then tag and push:  git tag v1.3.1 && git push origin main --tags
#
# Installed copies of COOL Code see the new release within a few hours (or via
# Settings → Check for updates) and offer a one-click update.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version $v"; exit 1; }

      - run: npm ci

      # Build only; the release job below publishes everything in one go
      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$(date +%Y.%m.%d-%H%M)";; esac
          ls -la dist
          # Clear out any earlier, partial release for this tag (e.g. a re-run)
          while gh release view "$tag" >/dev/null 2>&1; do
            gh release delete "$tag" --yes
          done
          gh release create "$tag" dist/* \
            --title "COOL Code ${tag#v}" \
            --notes "Download for Mac (Apple chip: *mac-arm64.zip* or *arm64.dmg*; Intel: *mac-x64.zip* or *x64.dmg*) or Windows (*COOL-Code-Setup*). Installed copies update themselves." \
            --verify-tag
