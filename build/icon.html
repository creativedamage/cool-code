<!DOCTYPE html>
<html><head><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3bff"/>
      <stop offset="0.55" stop-color="#b03cff"/>
      <stop offset="1" stop-color="#ff4f9a"/>

    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">

      <stop offset="1" stop-color="#fff" stop-opacity="0"/>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">

    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centred in 1024 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

    <use href="#finder" y="350"/>

    <g>

      <circle cx="250" cy="512" r="22"/><circle cx="330" cy="512" r="22"/><circle cx="420" cy="512" r="22"/>
      <circle cx="512" cy="512" r="30"/>
      <circle cx="600" cy="512" r="22"/><circle cx="690" cy="512" r="22"/><circle cx="780" cy="512" r="22"/>
      <circle cx="512" cy="600" r="22"/><circle cx="512" cy="690" r="22"/><circle cx="512" cy="780" r="22"/>
      <circle cx="600" cy="690" r="22"/><circle cx="690" cy="600" r="22"/>
      <circle cx="600" cy="780" r="22"/>

  </g>

    <path fill="#ffe66d" d="M0-78C8-24 24-8 78 0 24 8 8 24 0 78-8 24-24 8-78 0-24-8-8-24 0-78Z"/>
